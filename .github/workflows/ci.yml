# Runs on every pull request. Needs no AWS access: Terraform is validated and
# tested against mocked providers, and the catalog against an in-memory store.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/catalog/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws-foundation, network, app, edge]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mocked providers)
        if: hashFiles(format('infra/{0}/tests/*.tftest.hcl', matrix.stack)) != ''
        run: terraform test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Kubernetes manifest renders to valid YAML
        run: |
          CATALOG_IMAGE=x AWS_REGION=us-east-1 DB_HOST=x DB_NAME=x DB_SECRET_ARN=x \
            envsubst < k8s/catalog.yaml | python3 -c "import sys,yaml; docs=[d for d in yaml.safe_load_all(sys.stdin) if d]; print(len(docs), 'objects:', ', '.join(d['kind'] for d in docs))"
